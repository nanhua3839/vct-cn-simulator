<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vct-cn-simulator/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VCT CN 赛制晋级模拟器：全年赛程晋级状态判定、对阵图与积分排行" />
    <title>VCT CN 赛制晋级模拟器</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/vct-cn-simulator/src/main.ts"></script>
    <script>
      // GitHub Pages SPA redirect: 404.html 将路径存入 sessionStorage 后重定向到 /
      // 此脚本在首页加载时恢复真实路径，vue-router 即可正常匹配
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
  </body>
</html>

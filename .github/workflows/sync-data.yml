name: Sync VCT CN Data

on:
  schedule:
    # 非比赛日每日 1 次（23:00 UTC+8 = 15:00 UTC）
    # 比赛日每日 3 次（12:00, 18:00, 23:00 UTC+8）
    # 使用多个 cron 表达式覆盖
    - cron: '0 15 * * *'       # 23:00 UTC+8 每日
    - cron: '0 4 * * *'        # 12:00 UTC+8 比赛日
    - cron: '0 10 * * *'       # 18:00 UTC+8 比赛日
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/sync_data.py --output-dir public/data
      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/
          git diff --quiet && git diff --staged --quiet || git commit -m 'chore(data): auto-sync VCT CN data'
          git push